<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TEEZYY — TIME IS MONEY</title>
<meta name="description" content="TEEZYY — TIME IS MONEY. Album drops 13. november 2026.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--black:#000;--dark:#0a0a0a;--darker:#111;--gray:#1a1a1a;--white:#fff;--muted:#888}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--black);color:var(--white);font-family:'Inter Tight',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* GRAIN OVERLAY */
body::after{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:128px 128px;
  pointer-events:none;z-index:9999;opacity:0.4;
  animation:grain 0.5s steps(6) infinite;
}
@keyframes grain{
  0%,100%{transform:translate(0,0)}
  10%{transform:translate(-5%,-10%)}
  20%{transform:translate(-15%,5%)}
  30%{transform:translate(7%,-25%)}
  40%{transform:translate(-5%,25%)}
  50%{transform:translate(-15%,10%)}
  60%{transform:translate(15%,0%)}
  70%{transform:translate(0%,15%)}
  80%{transform:translate(3%,35%)}
  90%{transform:translate(-10%,10%)}
}

/* GLITCH EFFECT */
@keyframes glitch{
  0%{clip-path:inset(40% 0 61% 0);transform:translate(-2px,0)}
  2%{clip-path:inset(92% 0 1% 0);transform:translate(2px,0)}
  4%{clip-path:inset(43% 0 1% 0);transform:translate(-1px,0)}
  5%{clip-path:inset(25% 0 58% 0);transform:translate(0)}
  6%{clip-path:inset(54% 0 7% 0);transform:translate(3px,0)}
  7%{clip-path:inset(0);transform:translate(0)}
  100%{clip-path:inset(0);transform:translate(0)}
}
@keyframes glitch2{
  0%{clip-path:inset(65% 0 13% 0);transform:translate(3px,0)}
  3%{clip-path:inset(15% 0 62% 0);transform:translate(-3px,0)}
  5%{clip-path:inset(82% 0 2% 0);transform:translate(1px,0)}
  6%{clip-path:inset(0);transform:translate(0)}
  100%{clip-path:inset(0);transform:translate(0)}
}
@keyframes glitchPulse{
  0%,100%{opacity:1}
  50%{opacity:0.97}
  92%{opacity:1}
  93%{opacity:0.7;transform:skewX(-2deg)}
  94%{opacity:1;transform:skewX(0)}
}
@keyframes countPulse{
  0%,100%{text-shadow:0 0 10px rgba(255,255,255,0.1)}
  50%{text-shadow:0 0 20px rgba(255,255,255,0.3),0 0 40px rgba(255,255,255,0.1)}
}
@keyframes btnGlitch{
  0%,100%{transform:translate(0);filter:none}
  96%{transform:translate(0);filter:none}
  97%{transform:translate(-3px,1px);filter:hue-rotate(90deg)}
  98%{transform:translate(3px,-1px);filter:hue-rotate(-90deg)}
  99%{transform:translate(-1px,-2px);filter:none}
}

/* SCROLL REVEAL */
.reveal{opacity:0;transform:translateY(60px);transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1),transform 0.8s cubic-bezier(0.16,1,0.3,1)}
.reveal.from-left{transform:translateX(-80px) translateY(0)}
.reveal.from-right{transform:translateX(80px) translateY(0)}
.reveal.visible{opacity:1;transform:translate(0)}
.reveal.delay-1{transition-delay:0.15s}
.reveal.delay-2{transition-delay:0.3s}
.reveal.delay-3{transition-delay:0.45s}

/* ============ HERO ============ */
.hero{
  position:relative;width:100%;height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
.hero-bg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:url('images/hero.jpeg') center center/cover no-repeat;
  filter:brightness(0.35) contrast(1.1);
  transform:scale(1.05);
}
.hero-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,rgba(0,0,0,0.3) 0%,rgba(0,0,0,0.1) 40%,rgba(0,0,0,0.7) 80%,rgba(0,0,0,1) 100%);
}
.hero-content{position:relative;z-index:2;text-align:center;padding:0 20px}

.hero-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(5rem,18vw,14rem);
  letter-spacing:0.08em;
  line-height:0.85;
  position:relative;
  animation:glitchPulse 4s infinite;
}
.hero-title::before,.hero-title::after{
  content:'TEEZYY';position:absolute;top:0;left:0;width:100%;height:100%;
}
.hero-title::before{
  color:var(--white);animation:glitch 3s infinite linear;
  text-shadow:2px 0 #ff0040;
}
.hero-title::after{
  color:var(--white);animation:glitch2 3s infinite linear;
  text-shadow:-2px 0 #0ff;
}

.hero-subtitle{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.2rem,4vw,2.4rem);
  letter-spacing:0.35em;
  color:var(--muted);
  margin-top:12px;
}

/* COUNTDOWN */
.countdown{
  display:flex;gap:clamp(12px,4vw,32px);
  margin-top:clamp(28px,6vh,48px);
  justify-content:center;
}
.countdown-unit{text-align:center}
.countdown-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.4rem,8vw,5rem);
  line-height:1;
  animation:countPulse 2s ease-in-out infinite;
  position:relative;
}
.countdown-num::after{
  content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:80%;height:1px;background:rgba(255,255,255,0.15);
}
.countdown-label{
  font-size:clamp(0.55rem,1.5vw,0.75rem);
  letter-spacing:0.3em;text-transform:uppercase;
  color:var(--muted);margin-top:8px;font-weight:600;
}

/* PRE-SAVE BTN */
.btn-presave{
  display:inline-block;margin-top:clamp(28px,6vh,48px);
  padding:14px 40px;
  border:1px solid rgba(255,255,255,0.5);
  color:var(--white);text-decoration:none;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1rem,2.5vw,1.3rem);
  letter-spacing:0.25em;
  transition:all 0.3s ease;
  position:relative;overflow:hidden;
  background:transparent;cursor:pointer;
}
.btn-presave:hover{
  background:var(--white);color:var(--black);
  animation:btnGlitch 0.4s ease;
}
.btn-presave::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
  transition:left 0.5s ease;
}
.btn-presave:hover::before{left:100%}

/* ============ IMAGE SECTION ============ */
.image-section{
  padding:clamp(60px,12vh,140px) 20px;
  max-width:1200px;margin:0 auto;
  display:grid;
  grid-template-columns:1fr;
  gap:clamp(24px,4vw,48px);
}
.img-wrap{
  overflow:hidden;position:relative;
}
.img-wrap img{
  width:100%;height:auto;display:block;
  filter:grayscale(100%) contrast(1.05);
  transition:transform 0.8s cubic-bezier(0.16,1,0.3,1),filter 0.8s ease;
}
.img-wrap:hover img{
  transform:scale(1.03);
  filter:grayscale(80%) contrast(1.1);
}
.img-asymmetric{
  max-width:85%;
}
.img-asymmetric:nth-child(odd){margin-left:auto}
.img-asymmetric:nth-child(even){margin-right:auto}

/* ============ DAILY SNIPPET ============ */
.snippet-section{
  padding:clamp(60px,10vh,120px) 20px;
  max-width:700px;margin:0 auto;
  display:none;
}
.snippet-section.active{display:block}
.snippet-header{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(0.7rem,2vw,0.85rem);
  letter-spacing:0.4em;color:var(--muted);
  margin-bottom:6px;
}
.snippet-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2rem,6vw,3.5rem);
  letter-spacing:0.05em;
  margin-bottom:clamp(20px,4vh,36px);
}
.audio-player{
  display:flex;align-items:center;gap:16px;
  padding:16px 20px;
  background:var(--gray);
  border:1px solid rgba(255,255,255,0.06);
}
.play-btn{
  width:44px;height:44px;
  background:none;border:1px solid rgba(255,255,255,0.3);
  color:var(--white);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.2s ease;
}
.play-btn:hover{border-color:var(--white);background:rgba(255,255,255,0.05)}
.play-btn svg{width:18px;height:18px;fill:currentColor}
.progress-wrap{
  flex:1;height:3px;background:rgba(255,255,255,0.12);
  cursor:pointer;position:relative;
}
.progress-bar{
  height:100%;width:0%;background:var(--white);
  transition:width 0.1s linear;
}
.audio-time{
  font-size:0.75rem;color:var(--muted);font-variant-numeric:tabular-nums;
  min-width:36px;text-align:right;
}

/* ============ SPOTIFY ============ */
.spotify-section{
  padding:clamp(40px,8vh,100px) 20px;
  max-width:700px;margin:0 auto;
}
.section-label{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(0.65rem,1.5vw,0.8rem);
  letter-spacing:0.4em;color:var(--muted);
  margin-bottom:clamp(16px,3vh,28px);
}
.spotify-section iframe{
  width:100%;border:none;border-radius:12px;
}

/* ============ YOUTUBE ============ */
.youtube-section{
  padding:clamp(40px,8vh,100px) 20px;
  max-width:900px;margin:0 auto;
}
.video-grid{
  display:grid;grid-template-columns:1fr;
  gap:clamp(16px,3vw,28px);
}
.video-wrap{
  position:relative;padding-bottom:56.25%;height:0;overflow:hidden;
  background:var(--darker);
}
.video-wrap iframe{
  position:absolute;top:0;left:0;width:100%;height:100%;border:none;
}

/* ============ PRESAVE CTA ============ */
.presave-section{
  padding:clamp(80px,14vh,160px) 20px;
  text-align:center;
  position:relative;overflow:hidden;
}
.presave-section::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:url('images/city-dark.jpg') center center/cover no-repeat;
  filter:grayscale(100%) brightness(0.15) contrast(1.2);
  transform:scale(1.1);
}
.presave-section::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,var(--black),rgba(0,0,0,0.6),var(--black));
}
.presave-inner{position:relative;z-index:2}
.presave-big{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(3rem,12vw,9rem);
  letter-spacing:0.06em;line-height:0.9;
  margin-bottom:clamp(24px,5vh,48px);
}
.presave-sub{
  font-size:clamp(0.8rem,2vw,1rem);
  color:var(--muted);letter-spacing:0.15em;
  margin-bottom:clamp(24px,4vh,40px);
  text-transform:uppercase;
}

/* ============ FOOTER ============ */
.footer{
  padding:clamp(40px,8vh,80px) 20px clamp(30px,5vh,50px);
  text-align:center;
  border-top:1px solid rgba(255,255,255,0.05);
}
.social-links{
  display:flex;justify-content:center;
  gap:clamp(20px,4vw,36px);
}
.social-links a{
  color:rgba(255,255,255,0.5);
  transition:color 0.3s ease,transform 0.3s ease;
  display:block;
}
.social-links a:hover{color:var(--white);transform:translateY(-2px)}
.social-links svg{width:24px;height:24px;fill:currentColor}

/* PARALLAX */
.parallax-bg{
  position:relative;overflow:hidden;
}
.parallax-bg .parallax-img{
  position:absolute;top:-30%;left:0;width:100%;height:160%;
  object-fit:cover;
  filter:grayscale(100%) brightness(0.2) contrast(1.2);
  will-change:transform;
}

/* DIVIDER LINE */
.divider{
  width:40px;height:1px;background:rgba(255,255,255,0.15);
  margin:0 auto;
}

/* ============ DESKTOP ============ */
@media(min-width:768px){
  .image-section{
    grid-template-columns:1fr 1fr;
    gap:clamp(24px,3vw,48px);
    align-items:end;
  }
  .img-asymmetric{max-width:100%}
  .img-asymmetric:nth-child(odd){margin:0;transform:translateY(-40px)}
  .img-asymmetric:nth-child(even){margin:0;transform:translateY(40px)}
  .video-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:1024px){
  .image-section{max-width:1100px}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--black)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
</style>
</head>

<script>
/* ===== COUNTDOWN ===== */
(function(){
  const target=new Date('2026-11-13T00:00:00').getTime();
  const $d=document.getElementById('cd-days');
  const $h=document.getElementById('cd-hours');
  const $m=document.getElementById('cd-mins');
  const $s=document.getElementById('cd-secs');
  function pad(n){return n<10?'0'+n:n}
  function tick(){
    const now=Date.now();
    const diff=target-now;
    if(diff<=0){$d.textContent=$h.textContent=$m.textContent=$s.textContent='00';return}
    const d=Math.floor(diff/864e5);
    const h=Math.floor((diff%864e5)/36e5);
    const m=Math.floor((diff%36e5)/6e4);
    const s=Math.floor((diff%6e4)/1e3);
    $d.textContent=pad(d);$h.textContent=pad(h);
    $m.textContent=pad(m);$s.textContent=pad(s);
  }
  tick();setInterval(tick,1000);
})();

/* ===== SCROLL REVEALS ===== */
(function(){
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}});
  },{threshold:0.15,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
})();

/* ===== PARALLAX ===== */
(function(){
  const imgs=document.querySelectorAll('.parallax-img');
  if(!imgs.length)return;
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(!ticking){
      requestAnimationFrame(()=>{
        const scrollY=window.pageYOffset;
        imgs.forEach(img=>{
          const rect=img.parentElement.getBoundingClientRect();
          const speed=0.3;
          if(rect.bottom>0&&rect.top<window.innerHeight){
            img.style.transform='translateY('+(rect.top*speed)+'px)';
          }
        });
        ticking=false;
      });
      ticking=true;
    }
  });
})();

/* ===== DAILY SNIPPET ===== */
(function(){
  const section=document.getElementById('snippet-section');
  const today=new Date();
  const y=today.getFullYear();
  const m=String(today.getMonth()+1).padStart(2,'0');
  const d=String(today.getDate()).padStart(2,'0');
  const dateStr=y+'-'+m+'-'+d;
  const file='snippets/snippet-'+dateStr+'.mp3';
  const audio=new Audio();
  audio.preload='none';
  audio.src=file;

  const months=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
  document.getElementById('snippet-date').textContent=d+'. '+months[today.getMonth()]+' '+y;

  /* Check if snippet file exists */
  fetch(file,{method:'HEAD'}).then(r=>{
    if(r.ok){
      section.classList.add('active');
      audio.preload='metadata';
      initPlayer();
    }
  }).catch(()=>{});

  function initPlayer(){
    const playBtn=document.getElementById('play-btn');
    const playIcon=document.getElementById('play-icon');
    const progressWrap=document.getElementById('progress-wrap');
    const progressBar=document.getElementById('progress-bar');
    const timeEl=document.getElementById('audio-time');
    let playing=false;

    function fmt(s){
      const m=Math.floor(s/60);
      const sec=Math.floor(s%60);
      return m+':'+String(sec).padStart(2,'0');
    }

    playBtn.addEventListener('click',()=>{
      if(playing){audio.pause();playIcon.innerHTML='<polygon points="6,3 20,12 6,21"/>';playing=false}
      else{audio.play();playIcon.innerHTML='<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';playing=true}
    });
    audio.addEventListener('timeupdate',()=>{
      if(audio.duration){
        progressBar.style.width=(audio.currentTime/audio.duration*100)+'%';
        timeEl.textContent=fmt(audio.currentTime);
      }
    });
    audio.addEventListener('ended',()=>{
      playing=false;playIcon.innerHTML='<polygon points="6,3 20,12 6,21"/>';
      progressBar.style.width='0%';timeEl.textContent='0:00';
    });
    progressWrap.addEventListener('click',(e)=>{
      const rect=progressWrap.getBoundingClientRect();
      const pct=(e.clientX-rect.left)/rect.width;
      if(audio.duration)audio.currentTime=pct*audio.duration;
    });
  }
})();
</script>

</body>
