<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TEEZYY — TIME IS MONEY</title>
<meta name="description" content="TEEZYY — TIME IS MONEY. Album dropping November 13, 2026. Pre-save now.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TEEZYY">
<meta property="og:title" content="TEEZYY — TIME IS MONEY">
<meta property="og:description" content="Album dropping November 13, 2026. Pre-save now.">
<meta property="og:url" content="https://teezyy.com">
<meta property="og:image" content="https://teezyy.com/images/og-image.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#000;--dark:#0a0a0a;--darker:#111;--gray:#1a1a1a;
  --white:#fff;--text:#d6d6d6;--muted:#777;--dim:#555;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--black);color:var(--text);
  font-family:'Inter Tight',system-ui,sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}

/* GRAIN */
body::after{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:128px 128px;
  pointer-events:none;z-index:9999;opacity:0.35;
  animation:grain 0.8s steps(4) infinite;
}
@keyframes grain{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-5%,-10%)}
  50%{transform:translate(7%,-20%)}
  75%{transform:translate(-3%,15%)}
}

/* TYPOGRAPHY */
.label{
  font-family:'Inter Tight',sans-serif;font-size:clamp(0.6rem,1.4vw,0.75rem);
  letter-spacing:0.35em;text-transform:uppercase;color:var(--muted);font-weight:500;
}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:0 0 20px 2px rgba(255,255,255,0.08)}
}

/* SCROLL REVEAL */
.reveal{
  opacity:0;
  transition:opacity 1s cubic-bezier(0.16,1,0.3,1);
}
.reveal.visible{opacity:1}
.reveal.delay-1{transition-delay:0.15s}
.reveal.delay-2{transition-delay:0.3s}
.reveal.delay-3{transition-delay:0.45s}

/* ===== HERO ===== */
.hero{
  position:relative;width:100%;height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
.hero-bg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:url('images/hero.jpeg') center 30%/cover no-repeat;
  filter:brightness(0.45) contrast(1.1);
  transform:scale(1.05);
}
.hero-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,rgba(0,0,0,0.05) 35%,rgba(0,0,0,0.5) 75%,rgba(0,0,0,1) 100%);
}
.hero-content{
  position:relative;z-index:2;text-align:center;padding:0 20px;
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.3s both;
}
.hero-title{
  font-family:'Clash Display',sans-serif;font-weight:700;
  font-size:clamp(4.5rem,17vw,13rem);
  letter-spacing:0.04em;line-height:0.85;color:var(--text);
}
.hero-subtitle{
  font-family:'Clash Display',sans-serif;font-weight:500;
  font-size:clamp(1rem,3.5vw,2rem);
  letter-spacing:0.35em;
  color:var(--dim);margin-top:clamp(16px,3vh,24px);
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.6s both;
}
.hero-dropping{
  font-family:'Inter Tight',sans-serif;font-weight:500;
  font-size:clamp(0.65rem,1.6vw,0.85rem);
  letter-spacing:0.4em;text-transform:uppercase;
  color:var(--muted);margin-top:clamp(28px,5vh,40px);
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.8s both;
}

/* COUNTDOWN */
.countdown{
  display:flex;gap:clamp(16px,5vw,40px);
  margin-top:clamp(16px,2.5vh,24px);justify-content:center;
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.9s both;
}
.countdown-unit{text-align:center}
.countdown-num{
  font-family:'Clash Display',sans-serif;font-weight:600;
  font-size:clamp(2.2rem,7vw,4.5rem);line-height:1;
  color:var(--text);
}
.countdown-label{
  font-size:clamp(0.5rem,1.3vw,0.65rem);
  letter-spacing:0.4em;text-transform:uppercase;
  color:var(--muted);margin-top:8px;font-weight:500;
}
.countdown-divider{
  font-family:'Clash Display',sans-serif;font-weight:300;
  font-size:clamp(1.8rem,5vw,3.5rem);
  color:var(--dim);align-self:flex-start;margin-top:4px;
}

/* BUTTONS */
.btn{
  display:inline-block;
  padding:18px 56px;
  border:1px solid rgba(255,255,255,0.25);
  color:var(--text);text-decoration:none;
  font-family:'Clash Display',sans-serif;font-weight:500;
  font-size:clamp(1rem,2.5vw,1.3rem);
  letter-spacing:0.2em;text-transform:uppercase;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  position:relative;overflow:hidden;
  background:transparent;cursor:pointer;
}
.btn::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:var(--white);transform:translateX(-101%);
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);z-index:-1;
}
.btn:hover{color:var(--black);border-color:var(--white)}
.btn:hover::before{transform:translateX(0)}
.btn-hero{
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 1.2s both;
  margin-top:clamp(36px,6vh,56px);
}
.btn-large{padding:22px 64px;font-size:clamp(1.1rem,3vw,1.5rem)}

/* ===== SOCIAL BAR ===== */
.social-bar{padding:clamp(40px,7vh,70px) 20px;text-align:center}
.social-links{display:flex;justify-content:center;gap:clamp(28px,6vw,52px)}
.social-links a{
  color:var(--dim);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  display:block;position:relative;
}
.social-links a::after{
  content:'';position:absolute;bottom:-8px;left:50%;width:0;height:1px;
  background:var(--white);transition:all 0.3s ease;transform:translateX(-50%);
}
.social-links a:hover{color:var(--white);transform:translateY(-3px) scale(1.1)}
.social-links a:hover::after{width:100%}
.social-links svg{width:48px;height:48px;fill:currentColor}

/* ===== PHOTO GALLERY (skyline = background) ===== */
.gallery-skyline{
  position:relative;width:100%;overflow:hidden;
}
.gallery-skyline img{
  width:100%;display:block;
  filter:grayscale(100%) brightness(0.35) contrast(1.1);
}
.gallery-skyline::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:30%;
  background:linear-gradient(180deg,var(--black),transparent);z-index:1;pointer-events:none;
}
.gallery-photos{
  position:relative;z-index:2;
  margin-top:clamp(-140px,-18vw,-260px);
  padding:0 20px clamp(60px,10vh,120px);
  max-width:1100px;margin-left:auto;margin-right:auto;
}
.gallery-photos-grid{
  display:grid;grid-template-columns:1fr;gap:clamp(24px,4vw,40px);
}
.gallery-grid{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr;gap:clamp(24px,4vw,40px);
  max-width:1100px;margin:0 auto;
}
.img-wrap{
  overflow:hidden;position:relative;
  height:clamp(300px,50vw,440px);
}
.img-wrap img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  display:block;
  filter:grayscale(100%) contrast(1.05) brightness(0.85);
  transition:transform 1.2s cubic-bezier(0.16,1,0.3,1),filter 1.2s ease;
}
.img-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 15%,rgba(0,0,0,0.85) 100%);
}
.img-wrap:hover img{
  transform:scale(1.04);
  filter:grayscale(70%) contrast(1.1) brightness(0.9);
}
.img-offset-1{max-width:72%;margin-left:4%}
.img-offset-2{max-width:65%;margin-left:auto;margin-right:6%;margin-top:-40px}

/* ===== POOL ===== */
.pool-wrap{
  position:relative;width:100%;height:clamp(250px,40vh,400px);overflow:hidden;
}
.pool-wrap img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  display:block;
  filter:grayscale(100%) brightness(0.35) contrast(1.15);
}
.pool-wrap::after{
  content:'';position:absolute;bottom:0;left:0;width:100%;height:50%;
  background:linear-gradient(0deg,var(--black),transparent);
  pointer-events:none;
}

/* ===== DAILY SNIPPET ===== */
.snippet-section{
  padding:clamp(60px,10vh,120px) 20px;
  max-width:600px;margin:0 auto;
  display:none;
}
.snippet-section.active{display:block}
.snippet-title{
  font-family:'Clash Display',sans-serif;font-weight:600;
  font-size:clamp(1.6rem,5vw,2.8rem);
  color:var(--text);letter-spacing:0.02em;
  margin-bottom:clamp(16px,3vh,28px);
}
.snippet-track{
  font-family:'Inter Tight',sans-serif;font-size:0.8rem;
  color:var(--muted);letter-spacing:0.1em;margin-bottom:clamp(12px,2vh,20px);
}
.audio-player{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  animation:pulseGlow 4s ease-in-out infinite;
}
.play-btn{
  width:42px;height:42px;
  background:none;border:1px solid rgba(255,255,255,0.2);
  color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.3s ease;
}
.play-btn:hover{border-color:var(--white);color:var(--white);background:rgba(255,255,255,0.04)}
.play-btn svg{width:16px;height:16px;fill:currentColor}
.progress-wrap{flex:1;height:2px;background:rgba(255,255,255,0.1);cursor:pointer;position:relative}
.progress-bar{height:100%;width:0%;background:var(--white);transition:width 0.1s linear}
.audio-time{font-size:0.7rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.waveform{display:flex;align-items:center;gap:2px;height:24px;margin-top:12px}
.waveform-bar{width:3px;background:rgba(255,255,255,0.15);border-radius:1px;transition:height 0.2s ease}
.waveform-bar.active{background:var(--white)}

/* ===== SPOTIFY ===== */
.spotify-section{
  padding:clamp(40px,8vh,100px) 20px;
  max-width:650px;margin:0 auto;
}
.spotify-section iframe{width:100%;border:none;border-radius:12px}

/* ===== YOUTUBE ===== */
.youtube-section{
  padding:clamp(40px,8vh,100px) 20px;
  max-width:800px;margin:0 auto;

}
.video-stack{
  display:flex;flex-direction:column;
  gap:clamp(16px,3vw,28px);
}
.video-wrap{
  position:relative;padding-bottom:56.25%;height:0;overflow:hidden;
  background:var(--darker);
}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

/* ===== PRESAVE CTA ===== */
.presave-section{
  padding:clamp(80px,14vh,160px) 20px;
  text-align:center;position:relative;overflow:hidden;
}
.presave-section::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:url('images/city-dark.jpg') center center/cover no-repeat;
  filter:grayscale(100%) brightness(0.25) contrast(1.1);
  transform:scale(1.1);
}
.presave-section::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,var(--black) 0%,rgba(0,0,0,0.5) 50%,var(--black) 100%);
}
.presave-inner{position:relative;z-index:2}
.presave-big{
  font-family:'Clash Display',sans-serif;font-weight:700;
  font-size:clamp(3rem,13vw,10rem);
  letter-spacing:0.03em;line-height:0.88;color:var(--text);
  margin-bottom:10px;
}
.presave-album{
  font-family:'Clash Display',sans-serif;font-weight:500;
  font-size:clamp(0.9rem,2.5vw,1.4rem);
  letter-spacing:0.3em;text-transform:uppercase;
  color:var(--dim);margin-bottom:4px;
}
.presave-date{
  font-size:clamp(0.7rem,1.8vw,0.9rem);
  color:var(--muted);letter-spacing:0.15em;
  margin-bottom:clamp(32px,6vh,56px);
  text-transform:uppercase;
}

/* ===== FOOTER ===== */
.footer{
  padding:clamp(50px,8vh,80px) 20px clamp(40px,6vh,60px);
  text-align:center;
}
.footer-line{
  width:30px;height:1px;background:rgba(255,255,255,0.1);
  margin:0 auto clamp(20px,3vh,32px);
}
.footer-copy{font-size:0.65rem;color:var(--muted);letter-spacing:0.2em;margin-top:20px}

/* ===== DESKTOP ===== */
@media(min-width:768px){
  .gallery-photos-grid{
    grid-template-columns:1fr 1fr;
    gap:clamp(24px,3vw,48px);
  }
  .img-offset-1{max-width:100%;margin-left:0;transform:translateY(40px)}
  .img-offset-2{max-width:100%;margin-left:0;margin-right:0;margin-top:0;transform:translateY(-40px)}
  .img-wrap{height:clamp(320px,28vw,480px)}
  .video-stack{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .video-stack .video-wrap:first-child{grid-column:1/-1}
}

/* ===== MOBILE ONLY ===== */
@media(max-width:767px){
  .hero-content{margin-top:-10vh}
  .hero-subtitle{margin-top:20px}
  .hero-dropping{margin-top:32px}
  .countdown{margin-top:18px}
  .btn-hero{padding:22px 58px;font-size:1.15rem;margin-top:48px}
  .social-bar{padding:12px 20px 24px}
  .img-wrap{height:220px}
  .pool-wrap::before{
    content:'';position:absolute;top:0;left:0;width:100%;height:40%;
    background:linear-gradient(180deg,var(--black),transparent);
    z-index:1;pointer-events:none;
  }
  .youtube-section{margin-top:-80px;position:relative;z-index:2}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--black)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* LOADER */
.page-loader{
  position:fixed;inset:0;background:var(--black);z-index:99999;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1),visibility 0.8s;
}
.page-loader.done{opacity:0;visibility:hidden;pointer-events:none}
.loader-text{
  font-family:'Clash Display',sans-serif;font-weight:700;
  font-size:clamp(3.5rem,12vw,7rem);color:var(--white);
  letter-spacing:0.08em;
  position:relative;
  animation:loaderReveal 2.2s cubic-bezier(0.16,1,0.3,1) both;
}
.loader-text::before,.loader-text::after{
  content:'TEEZYY';position:absolute;top:0;left:0;width:100%;height:100%;
  overflow:hidden;
}
.loader-text::before{
  color:var(--white);
  animation:loaderScan 1.8s steps(1) infinite;
  clip-path:inset(0);
}
.loader-text::after{
  color:rgba(255,255,255,0.15);
  animation:loaderShadow 2.4s ease-in-out infinite;
}
@keyframes loaderReveal{
  0%{opacity:0;letter-spacing:0.5em;filter:blur(8px)}
  40%{opacity:1;letter-spacing:0.12em;filter:blur(0)}
  55%{letter-spacing:0.06em;transform:scaleX(1)}
  60%{transform:scaleX(1.02) skewX(-1deg)}
  65%{transform:scaleX(0.99) skewX(0.5deg)}
  70%{transform:scaleX(1) skewX(0)}
  100%{letter-spacing:0.08em}
}
@keyframes loaderScan{
  0%{clip-path:inset(0 0 95% 0)}
  10%{clip-path:inset(30% 0 50% 0)}
  15%{clip-path:inset(0)}
  20%{clip-path:inset(70% 0 10% 0)}
  25%{clip-path:inset(0)}
  40%{clip-path:inset(0)}
  42%{clip-path:inset(15% 0 75% 0);transform:translateX(3px)}
  44%{clip-path:inset(80% 0 5% 0);transform:translateX(-2px)}
  46%{clip-path:inset(0);transform:translateX(0)}
  100%{clip-path:inset(0)}
}
@keyframes loaderShadow{
  0%,100%{transform:translateX(0);opacity:0}
  30%{transform:translateX(4px) skewX(-2deg);opacity:0.15}
  60%{transform:translateX(-3px) skewX(1deg);opacity:0.1}
  90%{transform:translateX(0);opacity:0}
}
</style>
</head>
<body>

<script>
/* PAGE LOADER */
window.addEventListener('load',()=>{
  setTimeout(()=>document.getElementById('page-loader').classList.add('done'),1800);
});

/* COUNTDOWN — simple, no animation on numbers */
(function(){
  const target=new Date('2026-11-13T00:00:00').getTime();
  const $d=document.getElementById('cd-days');
  const $h=document.getElementById('cd-hours');
  const $m=document.getElementById('cd-mins');
  const $s=document.getElementById('cd-secs');
  function pad(n){return n<10?'0'+n:String(n)}
  function tick(){
    const diff=target-Date.now();
    if(diff<=0){$d.textContent=$h.textContent=$m.textContent=$s.textContent='00';return}
    $d.textContent=pad(Math.floor(diff/864e5));
    $h.textContent=pad(Math.floor((diff%864e5)/36e5));
    $m.textContent=pad(Math.floor((diff%36e5)/6e4));
    $s.textContent=pad(Math.floor((diff%6e4)/1e3));
  }
  tick();setInterval(tick,1000);
})();

/* SCROLL REVEALS — fade in only */
(function(){
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}});
  },{threshold:0.2,rootMargin:'0px 0px -100px 0px'});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
})();

/* PARALLAX */
(function(){
  const imgs=document.querySelectorAll('.parallax-img');
  if(!imgs.length)return;
  let ticking=false;
  function update(){
    const vh=window.innerHeight;
    imgs.forEach(img=>{
      const rect=img.parentElement.getBoundingClientRect();
      if(rect.bottom>0&&rect.top<vh){
        img.style.transform='translateY('+(rect.top*0.25)+'px)';
      }
    });
    ticking=false;
  }
  window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(update);ticking=true}});
})();

/* DAILY SNIPPET */
(function(){
  const section=document.getElementById('snippet-section');
  const today=new Date();
  const y=today.getFullYear();
  const m=String(today.getMonth()+1).padStart(2,'0');
  const d=String(today.getDate()).padStart(2,'0');
  const dateStr=y+'-'+m+'-'+d;
  const file='snippets/snippet-'+dateStr+'.mp3';

  const trackNames={
    '2026-11-06':'Backdoor',
    '2026-11-07':'Cables Packed',
    '2026-11-08':'Forever',
    '2026-11-09':'Fully Prepared',
    '2026-11-10':'Madden',
    '2026-11-11':'Money & Motion',
    '2026-11-12':'Stock'
  };

  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('snippet-date').textContent=months[today.getMonth()]+' '+parseInt(d)+', '+y;

  const trackEl=document.getElementById('snippet-track');
  if(trackNames[dateStr])trackEl.textContent=trackNames[dateStr]+' \u2014 30s preview';

  const audio=new Audio();
  audio.preload='none';audio.src=file;

  fetch(file,{method:'HEAD'}).then(r=>{
    if(r.ok){
      section.classList.add('active');
      audio.preload='metadata';
      initPlayer();
      buildWaveform();
    }
  }).catch(()=>{});

  function buildWaveform(){
    const wf=document.getElementById('waveform');
    for(let i=0;i<40;i++){
      const bar=document.createElement('div');
      bar.className='waveform-bar';
      bar.style.height=(Math.random()*16+4)+'px';
      wf.appendChild(bar);
    }
  }

  function initPlayer(){
    const playBtn=document.getElementById('play-btn');
    const playIcon=document.getElementById('play-icon');
    const progressWrap=document.getElementById('progress-wrap');
    const progressBar=document.getElementById('progress-bar');
    const timeEl=document.getElementById('audio-time');
    const bars=()=>document.querySelectorAll('.waveform-bar');
    let playing=false;

    function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}

    playBtn.addEventListener('click',()=>{
      if(playing){audio.pause();playIcon.innerHTML='<polygon points="7,3 21,12 7,21"/>';playing=false}
      else{audio.play();playIcon.innerHTML='<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';playing=true}
    });
    audio.addEventListener('timeupdate',()=>{
      if(!audio.duration)return;
      const pct=audio.currentTime/audio.duration;
      progressBar.style.width=(pct*100)+'%';
      timeEl.textContent=fmt(audio.currentTime);
      const b=bars();
      const activeCount=Math.floor(pct*b.length);
      b.forEach((bar,i)=>bar.classList.toggle('active',i<activeCount));
    });
    audio.addEventListener('ended',()=>{
      playing=false;playIcon.innerHTML='<polygon points="7,3 21,12 7,21"/>';
      progressBar.style.width='0%';timeEl.textContent='0:00';
      bars().forEach(b=>b.classList.remove('active'));
    });
    progressWrap.addEventListener('click',(e)=>{
      const rect=progressWrap.getBoundingClientRect();
      if(audio.duration)audio.currentTime=(e.clientX-rect.left)/rect.width*audio.duration;
    });
  }
})();

/* PRE-SAVE TRACKING */
function trackPresave(){
  if(typeof gtag==='function')gtag('event','presave_click',{event_category:'engagement'});
}
document.getElementById('hero-presave').addEventListener('click',trackPresave);
</script>
