<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TEEZYY — TIME IS MONEY</title>
<meta name="description" content="TEEZYY — TIME IS MONEY. The album is out now. Listen on Spotify.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TEEZYY">
<meta property="og:title" content="TEEZYY">
<meta property="og:description" content="TEEZYY.com">
<meta property="og:url" content="https://teezyy.com">
<meta property="og:image" content="https://teezyy.com/images/og-image.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<!-- Clash Display is a Fontshare font (not on Google Fonts) -->
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="canonical" href="https://teezyy.com/">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#000;--dark:#0a0a0a;--darker:#111;--gray:#1a1a1a;
  --white:#fff;--text:#d6d6d6;--muted:#777;--dim:#555;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:#000}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.snip-wave,.snip-play,.countdown{-webkit-user-select:none;user-select:none}
body{
  background:var(--black);color:var(--text);
  font-family:'Inter Tight',system-ui,sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}

/* GRAIN */
body::after{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  background-repeat:repeat;background-size:128px 128px;
  pointer-events:none;z-index:9999;opacity:0.35;
  animation:grain 0.8s steps(4) infinite;
}
@keyframes grain{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-5%,-10%)}
  50%{transform:translate(7%,-20%)}
  75%{transform:translate(-3%,15%)}
}

/* TYPOGRAPHY */
.label{
  font-family:'Inter Tight',sans-serif;font-size:clamp(0.6rem,1.4vw,0.75rem);
  letter-spacing:0.35em;text-transform:uppercase;color:var(--muted);font-weight:500;
}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes breathe{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
  50%{box-shadow:0 0 20px 2px rgba(255,255,255,0.08)}
}


/* ===== HERO ===== */
.hero{
  position:relative;width:100%;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
.hero-bg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:url('images/hero.jpeg') center 30%/cover no-repeat;
  filter:brightness(0.45) contrast(1.1);
  transform:scale(1.05);
}
.hero-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,rgba(0,0,0,0.05) 35%,rgba(0,0,0,0.5) 75%,rgba(0,0,0,1) 100%);
}
.hero-content{
  position:relative;z-index:2;text-align:center;padding:0 20px;
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.3s both;
}
.hero-title{
  font-family:'Clash Display',sans-serif;font-weight:700;
  font-size:clamp(4.5rem,17vw,13rem);
  letter-spacing:0.04em;line-height:0.85;color:var(--text);
}
.hero-subtitle{
  font-family:'Clash Display',sans-serif;font-weight:500;
  font-size:clamp(1rem,3.5vw,2rem);
  letter-spacing:0.35em;
  color:var(--dim);margin-top:clamp(16px,3vh,24px);
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.6s both;
}
.hero-dropping{
  font-family:'Inter Tight',sans-serif;font-weight:500;
  font-size:clamp(0.65rem,1.6vw,0.85rem);
  letter-spacing:0.4em;text-transform:uppercase;
  color:var(--muted);margin-top:clamp(28px,5vh,40px);
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.8s both;
}

/* released state: OUT NOW takes the countdown's place and weight */
.hero-dropping.is-out{
  font-family:'Clash Display',sans-serif;font-weight:600;
  font-size:clamp(2rem,7.5vw,4.2rem);line-height:1;letter-spacing:0.16em;
  color:var(--text);padding-left:0.16em;
}

/* COUNTDOWN */
.countdown{
  display:flex;gap:clamp(16px,5vw,40px);
  margin-top:clamp(16px,2.5vh,24px);justify-content:center;
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.9s both;
}
.countdown-unit{text-align:center;display:flex;flex-direction:column;align-items:center}
.countdown-num .dg{display:inline-block;width:0.62em;text-align:center}
.countdown-num{
  font-family:'Clash Display',sans-serif;font-weight:600;
  font-size:clamp(2.2rem,7vw,4.5rem);line-height:1;
  color:var(--text);display:flex;justify-content:center;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
}
.countdown-label{
  font-size:clamp(0.5rem,1.3vw,0.65rem);
  letter-spacing:0.4em;text-transform:uppercase;
  color:var(--muted);margin-top:8px;font-weight:500;
}
.countdown-divider{
  font-family:'Clash Display',sans-serif;font-weight:300;
  font-size:clamp(1.8rem,5vw,3.5rem);
  color:var(--dim);align-self:flex-start;margin-top:4px;
}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:0.6em;
  padding:18px 56px;
  border:1px solid rgba(255,255,255,0.25);
  color:var(--text);text-decoration:none;
  font-family:'Clash Display',sans-serif;font-weight:500;
  font-size:clamp(1rem,2.5vw,1.3rem);
  letter-spacing:0.2em;text-transform:uppercase;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  position:relative;overflow:hidden;
  background:transparent;cursor:pointer;
}
.btn::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:var(--white);transform:translateX(-101%);
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);z-index:-1;
}
.btn:hover{color:var(--black);border-color:var(--white)}
.btn:hover::before{transform:translateX(0)}
.btn-hero{
  animation:fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 1.2s both;
  margin-top:clamp(36px,6vh,56px);
}
.btn-ico{width:1.05em;height:1.05em;fill:currentColor;flex-shrink:0;margin-top:-0.08em}
.btn-label{white-space:nowrap}
.btn-large{padding:22px 64px;font-size:clamp(1.1rem,3vw,1.5rem)}

/* ===== SOCIAL BAR ===== */
.social-bar{
  padding:clamp(28px,5vh,56px) 20px clamp(8px,2vh,24px);text-align:center;
  position:relative;z-index:3;
}
.social-links{display:flex;justify-content:center;gap:clamp(26px,5vw,64px)}
.social-links a{
  color:var(--dim);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  display:block;position:relative;
}
.social-links a::after{
  content:'';position:absolute;bottom:-8px;left:50%;width:0;height:1px;
  background:var(--white);transition:all 0.3s ease;transform:translateX(-50%);
}
@media(hover:hover){
  .social-links a:hover{color:var(--white);transform:translateY(-3px) scale(1.1)}
  .social-links a:hover::after{width:100%}
}
.social-links svg{width:clamp(52px,6vw,76px);height:clamp(52px,6vw,76px);fill:currentColor;display:block}
.footer .social-links svg{width:44px;height:44px}

/* ===== PHOTO GALLERY (skyline = background) ===== */
.gallery-skyline{
  position:relative;width:100%;overflow:hidden;
  /* pulled up under the tracklist so the last rows sit over the skyline */
  margin-top:clamp(-460px,-30vw,-140px);z-index:1;
}
.gallery-skyline img{
  width:100%;display:block;
  filter:grayscale(100%) brightness(0.35) contrast(1.1);
}
.gallery-skyline::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:55%;
  background:linear-gradient(180deg,var(--black),transparent);z-index:1;pointer-events:none;
}
.gallery-photos{
  position:relative;z-index:2;
  margin-top:clamp(-140px,-18vw,-260px);
  padding:0 20px clamp(60px,10vh,120px);
  max-width:1100px;margin-left:auto;margin-right:auto;
}
.gallery-photos-grid{
  display:grid;grid-template-columns:1fr;gap:clamp(24px,4vw,40px);
}
.gallery-grid{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr;gap:clamp(24px,4vw,40px);
  max-width:1100px;margin:0 auto;
}
.img-wrap{
  overflow:hidden;position:relative;
  height:clamp(300px,50vw,440px);
}
.img-wrap img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  display:block;
  filter:grayscale(100%) contrast(1.05) brightness(0.85);
  transition:transform 1.2s cubic-bezier(0.16,1,0.3,1),filter 1.2s ease;
}
.img-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 15%,rgba(0,0,0,0.85) 100%);
}
@media(hover:hover){.img-wrap:hover img{
  transform:scale(1.04);
  filter:grayscale(70%) contrast(1.1) brightness(0.9);
}}
.img-offset-1{max-width:72%;margin-left:4%}
.img-offset-2{max-width:65%;margin-left:auto;margin-right:6%;margin-top:-40px}

/* ===== POOL ===== */
.pool-wrap{
  position:relative;width:100%;height:clamp(250px,40vh,400px);overflow:hidden;
}
.pool-wrap img{
  width:100%;height:100%;object-fit:cover;object-position:center;
  display:block;
  filter:grayscale(100%) brightness(0.35) contrast(1.15);
}
.pool-wrap::after{
  content:'';position:absolute;bottom:0;left:0;width:100%;height:50%;
  background:linear-gradient(0deg,var(--black),transparent);
  pointer-events:none;
}

/* ===== STUDIO (dark B/W backdrop behind snippet + music) ===== */
.studio-block{position:relative;overflow:hidden;isolation:isolate;padding-top:clamp(240px,42vw,560px)}
.studio-bg{
  position:absolute;top:0;left:0;right:0;height:clamp(420px,62vw,860px);z-index:-1;pointer-events:none;
}
.studio-bg img{
  width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block;
  filter:grayscale(100%) brightness(1) contrast(1.05);
  opacity:0;transition:opacity 2.4s ease;
}
.studio-bg img.loaded{opacity:1}
.studio-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,var(--black) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0.1) 55%,var(--black) 100%);
}

/* ===== FIELD (subtle B/W band leading into pre-save) ===== */
.field-wrap{
  position:relative;width:100%;height:clamp(260px,55vh,560px);overflow:hidden;
  margin-bottom:clamp(-160px,-12vh,-80px);
}
.field-wrap img{
  width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;
  filter:grayscale(100%) brightness(1.15) contrast(1.1);
  opacity:0;transition:opacity 2.4s ease;
}
.field-wrap img.loaded{opacity:1}
.field-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,var(--black) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0.05) 60%,var(--black) 100%);
}

/* ===== TRACKLIST ===== */
.tracklist-section{
  padding:clamp(48px,9vh,110px) 20px 0;
  max-width:1100px;margin:0 auto;position:relative;z-index:3;
}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:clamp(20px,4vh,40px)}
.tl-list{list-style:none;counter-reset:none}
.tl-row{
  display:grid;grid-template-columns:clamp(30px,6vw,64px) 1fr;align-items:baseline;
  padding:clamp(12px,1.8vh,18px) 0;
  border-top:1px solid rgba(255,255,255,0.07);
}
.tl-num{
  font-family:'Inter Tight',sans-serif;font-weight:500;font-variant-numeric:tabular-nums;
  font-size:clamp(0.75rem,1.6vw,1rem);color:var(--dim);letter-spacing:0.1em;
}
.tl-title{
  font-family:'Clash Display',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(1.85rem,8.2vw,5.4rem);line-height:0.95;letter-spacing:0.01em;
  color:var(--text);overflow-wrap:anywhere;
  transition:color 0.3s ease,transform 0.5s cubic-bezier(0.16,1,0.3,1);display:inline-block;
}
.tl-feat{
  display:inline-block;margin-left:0.6em;vertical-align:middle;
  font-family:'Inter Tight',sans-serif;font-weight:500;
  font-size:clamp(0.6rem,1.3vw,0.85rem);letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;
}
.tl-today{
  display:flex;width:fit-content;align-items:center;gap:6px;margin-top:10px;
  font-family:'Inter Tight',sans-serif;font-weight:600;
  font-size:clamp(0.55rem,1.2vw,0.7rem);letter-spacing:0.25em;text-transform:uppercase;
  color:var(--black);background:var(--text);padding:5px 8px 5px 9px;text-decoration:none;white-space:nowrap;
}
.tl-today::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--black);animation:breathe 1.6s ease-in-out infinite}
@media(hover:hover){.tl-row:hover .tl-title{color:var(--white);transform:translateX(8px)}}

/* ===== DAILY SNIPPET ===== */
.snippet-section{
  padding:clamp(56px,9vh,110px) 20px clamp(48px,8vh,100px);
  max-width:640px;margin:0 auto;
}
.snippet-section[hidden]{display:none}
.snip-title{
  font-family:'Clash Display',sans-serif;font-weight:600;text-transform:uppercase;
  font-size:clamp(2.4rem,11vw,4.6rem);line-height:0.92;letter-spacing:0.01em;
  color:var(--text);margin-top:clamp(12px,2vh,18px);overflow-wrap:anywhere;
}
.snip-feat{
  display:block;margin-top:10px;
  font-family:'Inter Tight',sans-serif;font-weight:500;
  font-size:clamp(0.65rem,1.6vw,0.8rem);letter-spacing:0.3em;color:var(--muted);
}
.snip-feat:empty{display:none}
.snip-box{
  display:flex;align-items:center;gap:clamp(12px,3.5vw,20px);
  margin-top:clamp(22px,4vh,32px);
  padding:clamp(12px,3vw,16px) clamp(14px,3.5vw,20px) clamp(12px,3vw,16px) clamp(12px,3vw,16px);
  background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08);border-radius:14px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.snip-play{
  width:52px;height:52px;flex-shrink:0;border-radius:50%;border:none;cursor:pointer;
  background:var(--text);color:var(--black);
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.25s cubic-bezier(0.16,1,0.3,1),background 0.25s ease,opacity 0.3s ease;
  -webkit-tap-highlight-color:transparent;
}
.snip-play:active{transform:scale(0.92)}
@media(hover:hover){.snip-play:hover{background:var(--white);transform:scale(1.05)}}
.snip-play:disabled{opacity:0.25;cursor:default;transform:none}
.snip-play svg{width:18px;height:18px;fill:currentColor}
.snip-play .i-play{margin-left:2px}
.snip-play .i-pause{display:none}
.snip-play.is-playing .i-play{display:none}
.snip-play.is-playing .i-pause{display:block}
.snip-play.is-loading{animation:breathe 1s ease-in-out infinite}
.snip-wave{
  flex:1;min-width:0;height:44px;display:flex;align-items:center;gap:2px;cursor:pointer;
  touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline:none;
}
.snip-wave span{
  flex:1;min-width:2px;border-radius:2px;background:rgba(255,255,255,0.16);
  transition:background 0.15s linear,height 0.6s cubic-bezier(0.16,1,0.3,1);
}
.snip-wave span.on{background:var(--text)}
.snip-wave:focus-visible{outline:1px solid rgba(255,255,255,0.3);outline-offset:6px}
.snip-time{
  flex-shrink:0;min-width:2.6em;text-align:right;
  font-size:0.72rem;letter-spacing:0.08em;color:var(--muted);font-weight:500;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
}
.snip-next{
  margin-top:14px;font-size:0.68rem;letter-spacing:0.25em;text-transform:uppercase;
  color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
}
.snippet-section.is-pre .snip-wave{cursor:default}

/* ===== SPOTIFY ===== */
.spotify-section{
  padding:clamp(40px,8vh,100px) 20px;
  max-width:650px;margin:0 auto;
}
.spotify-section iframe{width:100%;border:none;border-radius:12px;display:block;background:var(--darker)}
.spotify-section > div{min-height:352px;border-radius:12px;background:var(--darker)}
iframe.embed{opacity:0;transition:opacity 0.8s ease}
iframe.embed.ready{opacity:1}

/* ===== YOUTUBE ===== */
.youtube-section{
  padding:clamp(40px,8vh,100px) 20px;
  max-width:800px;margin:0 auto;

}
.video-stack{
  display:flex;flex-direction:column;
  gap:clamp(16px,3vw,28px);
}
.video-wrap{
  position:relative;padding-bottom:56.25%;height:0;overflow:hidden;
  background:var(--darker);
}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

/* ===== PRESAVE CTA ===== */
.presave-section{
  padding:clamp(80px,14vh,160px) 20px;
  text-align:center;position:relative;overflow:hidden;
}
.presave-section::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:url('images/city-dark.jpg') center center/cover no-repeat;
  filter:grayscale(100%) brightness(0.25) contrast(1.1);
  transform:scale(1.1);
}
.presave-section::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(180deg,var(--black) 0%,rgba(0,0,0,0.5) 50%,var(--black) 100%);
}
.presave-inner{position:relative;z-index:2}
.presave-big{
  font-family:'Clash Display',sans-serif;font-weight:700;
  font-size:clamp(3rem,13vw,10rem);
  letter-spacing:0.03em;line-height:0.88;color:var(--text);
  margin-bottom:10px;
}
.presave-album{
  font-family:'Clash Display',sans-serif;font-weight:500;
  font-size:clamp(0.9rem,2.5vw,1.4rem);
  letter-spacing:0.3em;text-transform:uppercase;
  color:var(--dim);margin-bottom:4px;
}
.presave-date{
  font-size:clamp(0.7rem,1.8vw,0.9rem);
  color:var(--muted);letter-spacing:0.15em;
  margin-bottom:clamp(32px,6vh,56px);
  text-transform:uppercase;
}

/* ===== FOOTER ===== */
.footer{
  padding:clamp(50px,8vh,80px) 20px clamp(40px,6vh,60px);
  text-align:center;
}
.footer-line{
  width:30px;height:1px;background:rgba(255,255,255,0.1);
  margin:0 auto clamp(20px,3vh,32px);
}
.footer-copy{font-size:0.65rem;color:var(--muted);letter-spacing:0.2em;margin-top:20px}
.footer-credit{
  display:inline-block;margin-top:14px;padding:6px 0;
  font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--dim);text-decoration:none;transition:color 0.3s ease;
}
.footer-credit:hover{color:var(--text)}

/* ===== DESKTOP ===== */
@media(min-width:768px){
  .gallery-photos-grid{
    grid-template-columns:1fr 1fr;
    gap:clamp(24px,3vw,48px);
  }
  .img-offset-1{max-width:100%;margin-left:0;transform:translateY(40px)}

  body::after{animation:none}
  /* no sticky hover states on touch */
  .btn:hover{color:var(--text);border-color:rgba(255,255,255,0.25)}
  .btn:hover::before{transform:translateX(-101%)}
  .btn:active{color:var(--black);border-color:var(--white)}

/* SCROLLBAR */

::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* LOADER */
.page-loader{
  position:fixed;inset:0;background:var(--black);z-index:99999;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1),visibility 0.8s;
  /* failsafe: hides itself even if JS never runs */
  animation:loaderAutoHide 0.8s ease 3.5s forwards;
}
@keyframes loaderAutoHide{to{opacity:0;visibility:hidden;pointer-events:none}}
.page-loader.done{opacity:0;visibility:hidden;pointer-events:none}
.loader-text{
  font-family:'Clash Display',sans-serif;font-weight:700;
  font-size:clamp(3.5rem,12vw,7rem);color:var(--white);
  letter-spacing:0.08em;
  position:relative;
  animation:loaderReveal 2.2s cubic-bezier(0.16,1,0.3,1) both;
}
.loader-text::before,.loader-text::after{
  content:'TEEZYY';position:absolute;top:0;left:0;width:100%;height:100%;
  overflow:hidden;
}
.loader-text::before{
  color:var(--white);
  animation:loaderScan 1.8s steps(1) infinite;
  clip-path:inset(0);
}
.loader-text::after{
  color:rgba(255,255,255,0.15);
  animation:loaderShadow 2.4s ease-in-out infinite;
}
@keyframes loaderReveal{
  0%{opacity:0;letter-spacing:0.5em;filter:blur(8px)}
  40%{opacity:1;letter-spacing:0.12em;filter:blur(0)}
  55%{letter-spacing:0.06em;transform:scaleX(1)}
  60%{transform:scaleX(1.02) skewX(-1deg)}
  65%{transform:scaleX(0.99) skewX(0.5deg)}
  70%{transform:scaleX(1) skewX(0)}
  100%{letter-spacing:0.08em}
}
@keyframes loaderScan{
  0%{clip-path:inset(0 0 95% 0)}
  10%{clip-path:inset(30% 0 50% 0)}
  15%{clip-path:inset(0)}
  20%{clip-path:inset(70% 0 10% 0)}
  25%{clip-path:inset(0)}
  40%{clip-path:inset(0)}
  42%{clip-path:inset(15% 0 75% 0);transform:translateX(3px)}
  44%{clip-path:inset(80% 0 5% 0);transform:translateX(-2px)}
  46%{clip-path:inset(0);transform:translateX(0)}
  100%{clip-path:inset(0)}
}
@keyframes loaderShadow{
  0%,100%{transform:translateX(0);opacity:0}
  30%{transform:translateX(4px) skewX(-2deg);opacity:0.15}
  60%{transform:translateX(-3px) skewX(1deg);opacity:0.1}
  90%{transform:translateX(0);opacity:0}
}
</style>

<script>
/* PAGE LOADER — dismiss after animation, don't wait for all assets */
setTimeout(()=>document.getElementById('page-loader').classList.add('done'),1600);

/* ===== CONFIG =====
   PRESAVE_URL: DistroKid HyperFollow page. The Spotify login popup on that page is what actually
   records the pre-save, so fans must go through it (a direct Spotify-auth link would not save).
   LISTEN_URL: where buttons go from release day. HyperFollow forwards to the album once it is live;
   swap in the open.spotify.com/album/... link here when it exists if you prefer. */
const PRESAVE_URL='https://distrokid.com/hyperfollow/teezyy4/time-is-money';
const LISTEN_URL='https://open.spotify.com/album/4syAzeUPFxXwZZXKBxxvTM';
const ARTIST_URL='https://open.spotify.com/artist/1TV53wsca4C4mEd0miL1NK';
/* Spotify releases at 00:00 in each listener's local time, so a local-time countdown is correct */
/* Album is out: flipped to released for everyone at 13 Nov 00:00 Danish time */
const RELEASE=Date.UTC(2026,10,12,23,0,0);

/* fade in subtle background photos once loaded */
document.querySelectorAll('img.fade-img').forEach(img=>{
  const show=()=>img.classList.add('loaded');
  if(img.complete&&img.naturalWidth)show();else img.addEventListener('load',show,{once:true});
});

/* ONE PLAYER AT A TIME: snippet stops when someone uses Spotify or a YouTube video */
const stopSnippet=()=>{try{window.teezyyStopSnippet&&window.teezyyStopSnippet()}catch(e){}};
function ytListen(f){
  if(!/youtube\.com/.test(f.src))return;
  try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:f.dataset.src,channel:'widget'}),'https://www.youtube.com')}catch(e){}
}
window.teezyyPauseEmbeds=function(){
  document.querySelectorAll('.video-wrap iframe[src]').forEach(f=>{
    try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:'pauseVideo',args:[]}),'https://www.youtube.com')}catch(e){}
  });
};
window.addEventListener('message',e=>{
  try{
    let d=e.data;if(typeof d==='string'){if(d[0]!=='{')return;d=JSON.parse(d)}
    if(!d||typeof d!=='object')return;
    if(e.origin==='https://www.youtube.com'){
      const st=d.event==='onStateChange'?d.info:(d.info&&d.info.playerState);
      if(st===1||st===3)stopSnippet();
    }else if(e.origin==='https://open.spotify.com'){
      const p=d.payload||d.data||d;
      if((d.type==='playback_update'||d.type==='playback_started')&&p&&p.isPaused===false)stopSnippet();
    }
  }catch(_){}
});

/* EMBEDS: load Spotify/YouTube about 1.5 screens before they scroll into view */
(function(){
  const frames=[...document.querySelectorAll('iframe.embed[data-src]')];
  const start=f=>{if(f.src)return;f.addEventListener('load',()=>{f.classList.add('ready');ytListen(f)},{once:true});f.src=f.dataset.src};
  if(!('IntersectionObserver' in window)){frames.forEach(start);return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){start(e.target);io.unobserve(e.target)}}),{rootMargin:'1600px 0px 1600px 0px'});
  frames.forEach(f=>io.observe(f));
})();

/* PRE-SAVE / LISTEN BUTTONS */
function trackPresave(){
  try{if(typeof gtag==='function')gtag('event','presave_click',{event_category:'engagement'})}catch(e){}
}
function setReleasedState(){
  const url=LISTEN_URL||ARTIST_URL;
  const hero=document.getElementById('hero-presave');
  const cta=document.getElementById('presave-link');
  [hero,cta].forEach(a=>{if(!a)return;a.href=url;a.target='_blank';a.rel='noopener'});
  [hero,cta].forEach(a=>{if(!a)return;const l=a.querySelector('.btn-label');if(l)l.textContent='LISTEN NOW';a.setAttribute('aria-label','Listen to Time Is Money')});
  const drop=document.querySelector('.hero-dropping');
  if(drop){drop.textContent='OUT NOW';drop.classList.add('is-out')}
  const al=document.getElementById('presave-album');
  if(al)al.textContent='OUT NOW';
  const cd=document.getElementById('countdown');
  if(cd)cd.style.display='none';
}
(function(){
  const cta=document.getElementById('presave-link');
  const hero=document.getElementById('hero-presave');
  [hero,cta].forEach(a=>{a.href=PRESAVE_URL||ARTIST_URL;a.target='_blank';a.rel='noopener'});
  [hero,cta].forEach(a=>a.addEventListener('click',trackPresave));
})();

/* COUNTDOWN — simple, no animation on numbers */
(function(){
  const target=RELEASE;
  const $d=document.getElementById('cd-days');
  const $h=document.getElementById('cd-hours');
  const $m=document.getElementById('cd-mins');
  const $s=document.getElementById('cd-secs');
  let timer=null,released=false;
  function pad(n){return n<10?'0'+n:String(n)}
  /* each digit sits in its own fixed-width cell, so nothing shifts when 1 -> 0 etc. */
  function setNum(el,n){
    const str=pad(n);
    if(el.children.length!==str.length){el.innerHTML=str.split('').map(c=>'<span class="dg">'+c+'</span>').join('');return}
    for(let i=0;i<str.length;i++){if(el.children[i].textContent!==str[i])el.children[i].textContent=str[i]}
  }
  function tick(){
    const diff=target-Date.now();
    if(diff<=0){
      [$d,$h,$m,$s].forEach(el=>setNum(el,0));
      if(!released){released=true;setReleasedState();if(timer)clearInterval(timer)}
      return;
    }
    setNum($d,Math.floor(diff/864e5));
    setNum($h,Math.floor((diff%864e5)/36e5));
    setNum($m,Math.floor((diff%36e5)/6e4));
    setNum($s,Math.floor((diff%6e4)/1e3));
  }
  tick();if(!released)timer=setInterval(tick,1000);
  /* resync instantly when a phone wakes the tab back up */
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!released)tick()});
})();


/* ===== TRACKLIST ===== */
const TRACKS=[
  {t:'Money & Motion'},{t:'Stock'},{t:'Fully Prepared'},{t:'Cables Packed'},{t:'Madden'},
  {t:'4Ever',ft:'Milez'},{t:'Ammo'},{t:'Rap More'},{t:'Tunnel',ft:'LF Scarz'}
];

/* ===== DAILY SNIPPETS =====
   One per day (visitor's local date) until release. Add a day = add a line + drop the mp3 in /snippets.
   w = real waveform (56 bars, 0-100) pre-computed from the mp3. */
const SNIPPETS={
  '2026-11-07':{t:'Fully Prepared',w:[38,66,77,96,82,92,94,77,84,86,86,95,84,73,92,76,84,100,81,72,94,50,47,64,57,48,49,51,50,55,57,52,47,52,77,83,80,88,78,87,91,86,91,79,67,64,37,18]},
  '2026-11-08':{t:'Money & Motion',w:[16,78,56,39,38,39,55,99,38,37,31,90,100,53,39,32,33,58,97,40,39,38,90,100,53,39,39,35,61,96,43,40,36,94,99,53,41,33,39,65,94,43,43,36,82,46,16,10]},
  '2026-11-09':{t:'Stock',w:[37,78,79,51,89,87,95,94,76,49,79,98,98,95,61,63,94,91,97,89,62,60,91,100,95,84,54,90,93,92,95,75,55,76,96,100,91,56,70,94,91,99,84,55,58,61,45,20]},
  '2026-11-10':{t:'4Ever',ft:'Milez',w:[37,82,98,60,52,76,93,93,91,43,60,91,98,98,69,47,59,98,99,98,53,55,100,96,97,84,47,57,94,95,93,61,47,72,94,95,96,40,58,89,95,98,70,40,71,69,45,21]},
  '2026-11-11':{t:'Tunnel',ft:'LF Scarz',w:[37,49,43,54,43,46,46,100,93,65,46,53,39,55,67,100,91,50,44,52,36,52,78,93,91,54,51,50,26,31,80,93,85,50,50,50,48,53,86,96,82,50,47,47,40,35,42,21]},
  '2026-11-12':{t:'Ammo',w:[37,77,86,42,55,44,95,95,96,46,75,100,89,87,47,43,57,94,93,95,40,76,100,87,90,48,42,57,92,91,93,39,83,98,87,90,46,42,61,91,91,91,38,85,88,58,37,10]}
};
const SNIP_DAYS=Object.keys(SNIPPETS).sort();

function localDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');

function renderTracklist(todayTitle){
  const ol=document.getElementById('tl-list');if(!ol)return;
  ol.innerHTML='';
  TRACKS.forEach((tr,i)=>{
    const li=document.createElement('li');li.className='tl-row';
    const num=document.createElement('span');num.className='tl-num';num.textContent=String(i+1).padStart(2,'0');
    const wrap=document.createElement('div');
    const title=document.createElement('span');title.className='tl-title';title.textContent=tr.t;
    wrap.appendChild(title);
    if(tr.ft){const f=document.createElement('span');f.className='tl-feat';f.textContent='ft. '+tr.ft;wrap.appendChild(f)}
    if(todayTitle&&norm(todayTitle)===norm(tr.t)){
      const a=document.createElement('a');a.className='tl-today';a.href='#snippet-section';a.textContent='Snippet today';
      wrap.appendChild(a);
    }
    li.appendChild(num);li.appendChild(wrap);ol.appendChild(li);
  });
}

(function(){
  const section=document.getElementById('snippet-section');
  const $title=document.getElementById('snip-title');
  const $feat=document.getElementById('snip-feat');
  const $play=document.getElementById('snip-play');
  const $wave=document.getElementById('snip-wave');
  const $time=document.getElementById('snip-time');
  const $next=document.getElementById('snip-next');
  const audio=new Audio();audio.preload='none';
  const FIRST=SNIP_DAYS[0],LAST=SNIP_DAYS[SNIP_DAYS.length-1];
  let state=null,current=null,bars=[],duration=30,dragging=false;

  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  const pad=n=>String(n).padStart(2,'0');

  function buildBars(levels){
    if(bars.length!==levels.length){
      $wave.innerHTML='';bars=[];
      levels.forEach(()=>{const b=document.createElement('span');$wave.appendChild(b);bars.push(b)});
    }
    levels.forEach((v,i)=>{bars[i].style.height=Math.max(8,v)+'%'});
  }
  function paint(t){
    const pct=duration?Math.min(1,t/duration):0;
    const on=Math.round(pct*bars.length);
    for(let i=0;i<bars.length;i++)bars[i].classList.toggle('on',i<on);
    /* show remaining time while playing, full length when idle */
    $time.textContent=(t>0?fmt(Math.max(0,duration-t)):fmt(duration));
    $wave.setAttribute('aria-valuenow',Math.round(t));
  }

  /* decide what to show for a given local date */
  function load(dateStr){
    const key=Date.now()>=RELEASE?'done':SNIPPETS[dateStr]?dateStr:dateStr<FIRST?'pre':'done';
    if(key===state)return;state=key;
    audio.pause();
    if(key==='done'){section.hidden=true;current=null;renderTracklist(null);return}
    section.hidden=false;
    if(key==='pre'){
      current=null;
      section.classList.add('is-pre');
      $title.textContent='First drop soon';$feat.textContent='';
      buildBars(new Array(48).fill(10));duration=30;paint(0);
      $play.disabled=true;$time.textContent='0:30';
      renderTracklist(null);return;
    }
    section.classList.remove('is-pre');
    const snip=SNIPPETS[key];current=key;
    audio.src='snippets/snippet-'+key+'.mp3';audio.preload='none';
    $title.textContent=snip.t;
    $feat.textContent=snip.ft?'FT. '+snip.ft.toUpperCase():'';
    buildBars(snip.w);duration=30;paint(0);
    $play.disabled=false;$play.classList.remove('is-playing','is-loading');
    renderTracklist(snip.t);
    if('mediaSession' in navigator){
      try{navigator.mediaSession.metadata=new MediaMetadata({title:snip.t+(snip.ft?' (ft. '+snip.ft+')':'')+' - snippet',artist:'Teezyy',album:'Time Is Money',
        artwork:[{src:'images/apple-touch-icon.png',sizes:'180x180',type:'image/png'}]})}catch(e){}
    }
  }

  /* play / pause */
  $play.addEventListener('click',()=>{
    if(!current)return;
    if(audio.paused){
      $play.classList.add('is-loading');
      const p=audio.play();
      if(p&&p.catch)p.catch(()=>{$play.classList.remove('is-loading','is-playing')});
    }else audio.pause();
  });
  window.teezyyStopSnippet=()=>{if(!audio.paused)audio.pause()};
  audio.addEventListener('play',()=>{try{window.teezyyPauseEmbeds&&window.teezyyPauseEmbeds()}catch(e){}});
  audio.addEventListener('playing',()=>{$play.classList.remove('is-loading');$play.classList.add('is-playing');$play.setAttribute('aria-label','Pause snippet')});
  audio.addEventListener('pause',()=>{$play.classList.remove('is-playing','is-loading');$play.setAttribute('aria-label','Play snippet')});
  audio.addEventListener('waiting',()=>$play.classList.add('is-loading'));
  audio.addEventListener('loadedmetadata',()=>{if(audio.duration&&isFinite(audio.duration)){duration=audio.duration;paint(audio.currentTime)}});
  audio.addEventListener('timeupdate',()=>{if(!dragging)paint(audio.currentTime)});
  audio.addEventListener('ended',()=>{try{audio.currentTime=0}catch(e){}paint(0)});
  audio.addEventListener('error',()=>{$play.classList.remove('is-loading','is-playing')});

  /* seek: tap or drag on the waveform */
  function seekFromX(x){
    const r=$wave.getBoundingClientRect();
    const t=Math.min(1,Math.max(0,(x-r.left)/r.width))*duration;paint(t);return t;
  }
  let pendingSeek=null;
  audio.addEventListener('loadedmetadata',()=>{if(pendingSeek!==null){try{audio.currentTime=pendingSeek}catch(e){}pendingSeek=null}});
  function commit(t){
    if(audio.readyState<1)pendingSeek=t;else{try{audio.currentTime=t}catch(e){}}
    if(audio.paused){$play.classList.add('is-loading');const p=audio.play();if(p&&p.catch)p.catch(()=>{$play.classList.remove('is-loading')})}
  }
  $wave.addEventListener('pointerdown',e=>{if(!current)return;dragging=true;try{$wave.setPointerCapture(e.pointerId)}catch(_){}seekFromX(e.clientX)});
  $wave.addEventListener('pointermove',e=>{if(dragging)seekFromX(e.clientX)});
  $wave.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;commit(seekFromX(e.clientX))});
  $wave.addEventListener('pointercancel',()=>{dragging=false;paint(audio.currentTime)});
  $wave.addEventListener('keydown',e=>{
    if(!current)return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();const t=Math.min(duration,Math.max(0,audio.currentTime+(e.key==='ArrowRight'?5:-5)));
      try{audio.currentTime=t}catch(_){}paint(t);
    }else if(e.key===' '||e.key==='Enter'){e.preventDefault();$play.click()}
  });

  /* "next snippet in" ticker + midnight rollover */
  function tickNext(){
    const now=new Date();
    load(localDateStr(now));
    if(state==='done'){$next.textContent='';return}
    const mid=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1).getTime();
    const target=current===LAST?RELEASE:mid;
    const label=state==='pre'?'First snippet in ':current===LAST?'Full album in ':'Next snippet in ';
    const d=Math.max(0,target-now.getTime());
    const hh=Math.floor(d/36e5),mm=Math.floor(d%36e5/6e4),ss=Math.floor(d%6e4/1e3);
    $next.textContent=label+pad(hh)+':'+pad(mm)+':'+pad(ss);
  }
  tickNext();setInterval(tickNext,1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tickNext()});
})();
</script>
